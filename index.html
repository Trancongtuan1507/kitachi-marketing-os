<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marketing OS · Kitachi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h6a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></symbol>
  <symbol id="i-time" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h5M7 17h9"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L20 8a2.8 2.8 0 0 0-4-4L4 16v4z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-signal" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20v-4"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20c0-3.5 3-5.4 6.5-5.4s6.5 1.9 6.5 5.4"/><path d="M16.5 5.2a3.4 3.4 0 0 1 0 5.6M18 14.8c2.2.6 3.5 2.3 3.5 5.2"/></symbol>
  <symbol id="i-money" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3"/><circle cx="12" cy="12" r="2.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v5M12 17.5h.01"/><path d="M10.3 3.9 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
  <symbol id="i-meet" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="M16 10.5 22 7v10l-6-3.5z"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 21h18M7 21V10M12 21V4M17 21v-7"/></symbol>
  <symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
  <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="2"/><rect x="10" y="4" width="5" height="11" rx="2"/><rect x="17" y="4" width="4" height="8" rx="2"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 3s5 4 5 9a5 5 0 0 1-10 0c0-2 1-3 1-3s.5 2 2 2c0-3 2-5 2-8z"/></symbol>
  <symbol id="i-loop" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4.5L4 9"/><path d="M4 13a8 8 0 0 0 14 4.5L20 15"/><path d="M4 5v4h4M20 19v-4h-4"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10.5 13.5M21 3l-6.5 18-4-8-8-4L21 3z"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="M16 10.5 22 7v10l-6-3.5z"/></symbol>
  <symbol id="i-brush" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="8" rx="2"/><path d="M12 11v4M9 15h6v6H9z"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 12h18M3 8h4M3 16h4M17 8h4M17 16h4"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1l8.8 8.8 8.8-8.8a5 5 0 0 0 0-7.1z"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V5a1.5 1.5 0 0 1 3 0v6M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V6a1.5 1.5 0 0 1 3 0v7"/><path d="M17 10a1.5 1.5 0 0 1 3 0v5a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-2a1.5 1.5 0 0 1 3 0"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 12h5l2 3h4l2-3h5"/><path d="M5 5h14l2 7v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5l2-7z"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-1.5 4L16 12H5"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 8h18v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/><path d="M2 4h20v4H2zM10 12h4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13M10 11v6M14 11v6"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></symbol>
</svg>

<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="login-mark">M</div>
    <h1>Marketing OS</h1>
    <p class="login-sub">Phòng Marketing · Kitachi</p>
    <div class="lab">Bạn là ai</div>
    <div id="memberList" class="member-list"></div>
    <div class="lab">Mã PIN</div>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off">
    <button id="loginBtn" class="btn btn-pri btn-full">Đăng nhập</button>
    <div id="loginErr" class="login-err"></div>
  </div>
</div>

<div id="app" class="shell hidden">
  <aside class="side" id="side">
    <div class="side-brand">
      <div class="mark">M</div>
      <div><div class="mark-t">Marketing OS</div><div class="mark-s">Kitachi · phòng Marketing</div></div>
    </div>
    <nav class="side-nav" id="nav">
      <div class="side-lab">Hằng ngày</div>
      <button class="nav-i active" data-view="dash"><svg class="ic"><use href="#i-grid"/></svg><span>Trang chủ</span></button>
      <button class="nav-i" data-view="reports"><svg class="ic"><use href="#i-doc"/></svg><span>Báo cáo ngày</span><i class="nav-b" id="nRep"></i></button>
      <button class="nav-i" data-view="approvals"><svg class="ic"><use href="#i-bell"/></svg><span>Phê duyệt</span><i class="nav-b" id="nApr"></i></button>
      <button class="nav-i" data-view="duty"><svg class="ic"><use href="#i-cal"/></svg><span>Lịch trực nhật</span></button>

      <div class="side-lab">Phòng ban</div>
      <button class="nav-i" data-view="work"><svg class="ic"><use href="#i-pen"/></svg><span>Content Marketing</span><i class="nav-b" id="bwork"></i></button>
      <button class="nav-i" data-view="d-edit"><svg class="ic"><use href="#i-film"/></svg><span>Editor Video</span><i class="nav-b" id="bedit"></i></button>
      <button class="nav-i" data-view="d-design"><svg class="ic"><use href="#i-brush"/></svg><span>Designer</span><i class="nav-b" id="bdesign"></i></button>

      <div class="side-lab">Nội dung &amp; kênh</div>
      <button class="nav-i" data-view="cal"><svg class="ic"><use href="#i-cal"/></svg><span>Lịch đăng</span></button>
      <button class="nav-i" data-view="channels"><svg class="ic"><use href="#i-signal"/></svg><span>Kênh &amp; chỉ số</span></button>

      <div class="side-lab">Dự án</div>
      <button class="nav-i" data-view="projects"><svg class="ic"><use href="#i-folder"/></svg><span>Dự án</span><i class="nav-b" id="nProjects"></i></button>
      <button class="nav-i" data-view="tasks"><svg class="ic"><use href="#i-check"/></svg><span>Đầu việc</span><i class="nav-b" id="nTasks"></i></button>
      <button class="nav-i" data-view="timeline"><svg class="ic"><use href="#i-time"/></svg><span>Tiến độ &amp; đợt việc</span></button>
      <button class="nav-i" data-view="risks"><svg class="ic"><use href="#i-alert"/></svg><span>Rủi ro</span><i class="nav-b" id="nRisks"></i></button>

      <div class="side-lab">Ngân sách &amp; quảng cáo</div>
      <button class="nav-i" data-view="ads"><svg class="ic"><use href="#i-chart"/></svg><span>Quảng cáo</span><i class="nav-b" id="nAds"></i></button>
      <button class="nav-i" data-view="budget"><svg class="ic"><use href="#i-money"/></svg><span>Ngân sách</span></button>

      <div class="side-lab">Đội ngũ</div>
      <button class="nav-i" data-view="perf"><svg class="ic"><use href="#i-target"/></svg><span>Hiệu suất</span></button>
      <button class="nav-i" data-view="team"><svg class="ic"><use href="#i-users"/></svg><span>Thành viên</span></button>
      <button class="nav-i" data-view="org"><svg class="ic"><use href="#i-share"/></svg><span>Cơ cấu tổ chức</span></button>
      <button class="nav-i" data-view="roles"><svg class="ic"><use href="#i-cog"/></svg><span>Vai trò &amp; quyền</span></button>
      <button class="nav-i" data-view="kudos"><svg class="ic"><use href="#i-heart"/></svg><span>Ghi nhận đồng đội</span></button>
      <button class="nav-i" data-view="meets"><svg class="ic"><use href="#i-meet"/></svg><span>Cuộc họp</span></button>

      <div class="side-lab">Hệ thống</div>
      <button class="nav-i" data-view="docs"><svg class="ic"><use href="#i-doc"/></svg><span>Tài liệu</span></button>
      <button class="nav-i" data-view="activity"><svg class="ic"><use href="#i-loop"/></svg><span>Nhật ký</span></button>
      <button class="nav-i" data-view="archive"><svg class="ic"><use href="#i-box"/></svg><span>Lưu trữ</span><i class="nav-b" id="nArch"></i></button>
      <button class="nav-i" data-view="setup"><svg class="ic"><use href="#i-cog"/></svg><span>Cài đặt</span></button>
    </nav>



    <div class="side-foot">
      <div class="side-user">
        <div class="av" id="sideAv"></div>
        <div class="side-user-t"><div id="whoName" class="su-n"></div><div id="whoRole" class="su-r"></div></div>
        <button id="logout" class="icobtn" aria-label="Đăng xuất"><svg class="ic"><use href="#i-out"/></svg></button>
      </div>
    </div>
  </aside>
  <div class="side-bg" id="sideBg"></div>

  <div class="main">
    <header class="topbar">
      <button class="icobtn only-m" id="burger" aria-label="Menu"><svg class="ic"><use href="#i-menu"/></svg></button>
      <select id="projSel" class="proj-sel"></select>
      <div class="search"><svg class="ic"><use href="#i-search"/></svg>
        <input id="q" type="text" placeholder="Tìm công việc, bài đăng…"></div>
      <div class="top-r">
        <button class="icobtn" id="bellBtn" aria-label="Nhắc việc"><svg class="ic"><use href="#i-bell"/></svg><i class="dot-red" id="bellDot"></i></button>
        <button class="btn btn-pri" id="quickAdd"><svg class="ic"><use href="#i-plus"/></svg><span class="hide-s">Tạo mới</span></button>
      </div>
    </header>
    <main id="mainBody"></main>
  </div>

  <nav class="botnav only-m">
    <button class="bn active" data-view="dash"><svg class="ic"><use href="#i-grid"/></svg><span>Tổng hợp</span></button>
    <button class="bn" data-view="tasks"><svg class="ic"><use href="#i-check"/></svg><span>Công việc</span></button>
    <button class="bn" data-view="work"><svg class="ic"><use href="#i-inbox"/></svg><span>Công việc</span></button>
    <button class="bn" data-view="reports"><svg class="ic"><use href="#i-doc"/></svg><span>Báo cáo</span></button>
    <button class="bn" data-view="projects"><svg class="ic"><use href="#i-folder"/></svg><span>Dự án</span></button>
  </nav>
  <div id="toast" class="toast"></div>
</div>

<div id="drawer" class="drawer hidden">
  <div class="drawer-bg"></div>
  <div class="drawer-panel">
    <button class="drawer-close" aria-label="Đóng"><svg class="ic"><use href="#i-x"/></svg></button>
    <div id="drawerBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="./config.js"></script>
<script src="./demo-data.js"></script>
<script src="./app.js"></script>
</body>
</html>
